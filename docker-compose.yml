services:
  caption-scraper:
    build: ./caption-scraper
    image: wefluence/caption-scraper:latest
    container_name: wefluence-caption-scraper
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - wefluence
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  matrix-scrapper:
    build: ./matrix-scrapper
    image: wefluence/matrix-scrapper:latest
    container_name: wefluence-matrix-scrapper
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Instagram bypass datacenter-IP block. Isi nilainya di file .env
      # (sebelah docker-compose.yml).
      #   IG_SESSIONID = cookie sessionid akun burner IG. BISA BANYAK (pisah koma)
      #                  untuk dirotasi otomatis → sebar beban, hindari flag.
      #                  contoh: IG_SESSIONID=sid_akun1,sid_akun2,sid_akun3
      #   IG_PROXY     = http://user:pass@host:port (residential proxy, opsional)
      # Throttle anti-bot (opsional, default aman):
      #   IG_MAX_CONCURRENCY = request IG bersamaan (default 2)
      #   IG_MIN_DELAY / IG_MAX_DELAY = jeda acak antar request detik (default 0.8/2.5)
      - IG_SESSIONID=${IG_SESSIONID:-}
      - IG_PROXY=${IG_PROXY:-}
      - IG_MAX_CONCURRENCY=${IG_MAX_CONCURRENCY:-2}
      - IG_MIN_DELAY=${IG_MIN_DELAY:-0.8}
      - IG_MAX_DELAY=${IG_MAX_DELAY:-2.5}
      # YouTube Data API v3 (resmi) — 50 video/panggilan, tanpa bot-check.
      # Isi di file .env: YT_API_KEY=AIza... (Google Cloud Console → enable
      # "YouTube Data API v3" → Credentials → API Key). Kosong = fallback scraping.
      - YT_API_KEY=${YT_API_KEY:-}
    networks:
      - wefluence
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai-support:
    build: ./wefluence-ai-support
    image: wefluence/ai-support:latest
    container_name: wefluence-ai-support
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./wefluence-ai-support/.env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - wefluence
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: wefluence-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      caption-scraper:
        condition: service_started
      matrix-scrapper:
        condition: service_started
      ai-support:
        condition: service_started
    networks:
      - wefluence
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  wefluence:
    driver: bridge

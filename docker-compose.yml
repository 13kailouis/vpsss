services:
  caption-scraper:
    build: ./caption-scraper
    image: wefluence/caption-scraper:latest
    container_name: wefluence-caption-scraper
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      # YouTube Data API v3 (resmi) — sumber caption paling andal, tanpa bot-check.
      # Key SAMA dengan matrix-scrapper (isi di .env: YT_API_KEY=AIza...). Kosong =
      # fallback ke scraping watch-page + InnerTube (tetap jauh lebih baik dari lama).
      - YT_API_KEY=${YT_API_KEY:-}
      # Instagram: cookie sessionid akun burner untuk bypass blok IP datacenter
      # (VPS kena HTTP 429 di semua UA tanpa login). Bisa banyak (pisah koma) untuk
      # dirotasi. Isi di .env: IG_SESSIONID=sid1,sid2. IG_PROXY opsional (residential).
      - IG_SESSIONID=${IG_SESSIONID:-}
      - IG_PROXY=${IG_PROXY:-}
    networks:
      - wefluence
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  matrix-scrapper:
    build: ./matrix-scrapper
    image: wefluence/matrix-scrapper:latest
    container_name: wefluence-matrix-scrapper
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Instagram bypass datacenter-IP block. Isi nilainya di file .env
      # (sebelah docker-compose.yml).
      #   IG_SESSIONID = cookie sessionid akun burner IG. BISA BANYAK (pisah koma)
      #                  untuk dirotasi otomatis → sebar beban, hindari flag.
      #                  contoh: IG_SESSIONID=sid_akun1,sid_akun2,sid_akun3
      #   IG_PROXY     = http://user:pass@host:port (residential proxy, opsional)
      # Throttle anti-bot (opsional, default aman):
      #   IG_MAX_CONCURRENCY = request IG bersamaan (default 2)
      #   IG_MIN_DELAY / IG_MAX_DELAY = jeda acak antar request detik (default 0.8/2.5)
      - IG_SESSIONID=${IG_SESSIONID:-}
      - IG_PROXY=${IG_PROXY:-}
      - IG_MAX_CONCURRENCY=${IG_MAX_CONCURRENCY:-2}
      - IG_MIN_DELAY=${IG_MIN_DELAY:-0.8}
      - IG_MAX_DELAY=${IG_MAX_DELAY:-2.5}
      # Jalur publik tanpa cookie (api/ig_public.py).
      #   IG_PUBLIC_MODE = fallback (bawaan, dipakai kalau jalur sessionid gagal)
      #                    | first | only | off
      #   IG_GRID_RELAY     = alamat relay untuk mengambil halaman profil, yang
      #                       ditolak 429 dari IP datacenter mana pun (VPS
      #                       maupun Cloudflare Worker sudah diuji dan ditolak).
      #                       Isi dengan relay yang jalan di koneksi residensial,
      #                       lihat matrix-scrapper/local-relay/.
      #   IG_GRID_RELAY_KEY = kunci yang sama dengan RELAY_KEY di relay itu.
      #   IG_GRID_PROXY     = alternatif berbayar: proxy residensial, khusus
      #                       panggilan grid. Satu panggilan ~138 KB di kabel.
      #   IG_GRID_TTL       = umur cache grid per-creator, detik (bawaan 120).
      # IG_META_VIEWS_AS_VIEWS sengaja TIDAK diteruskan ke sini. Menyalakannya
      # membuat angka meta dipakai sebagai views, dan angka itu sekitar setengah
      # dari yang dilihat kreator. Kalau suatu saat benar-benar dibutuhkan,
      # tambahkan sadar-sadar, jangan lewat .env yang tidak terbaca siapa pun.
      - IG_PUBLIC_MODE=${IG_PUBLIC_MODE:-fallback}
      - IG_GRID_RELAY=${IG_GRID_RELAY:-}
      - IG_GRID_RELAY_KEY=${IG_GRID_RELAY_KEY:-}
      - IG_GRID_PROXY=${IG_GRID_PROXY:-}
      - IG_GRID_TTL=${IG_GRID_TTL:-120}
      # YouTube Data API v3 (resmi) — 50 video/panggilan, tanpa bot-check.
      # Isi di file .env: YT_API_KEY=AIza... (Google Cloud Console → enable
      # "YouTube Data API v3" → Credentials → API Key). Kosong = fallback scraping.
      - YT_API_KEY=${YT_API_KEY:-}
    networks:
      - wefluence
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai-support:
    build: ./wefluence-ai-support
    image: wefluence/ai-support:latest
    container_name: wefluence-ai-support
    restart: unless-stopped
    expose:
      - "8000"
    # SEMUA konfigurasi service ini lewat env_file, bukan lewat blok
    # `environment` di bawah. Daftar lengkapnya beserta penjelasannya ada di
    # wefluence-ai-support/.env.example. Yang wajib: GROQ_API_KEY dan
    # FIREBASE_SERVICE_ACCOUNT. Yang sangat disarankan: GEMINI_API_KEY, karena
    # itu jalur cadangan waktu Groq mati atau kena batas.
    #
    # Sakelar yang perlu diingat:
    #   REQUIRE_AUTH=1           nyalakan SETELAH patch klien web + mobile tayang
    #   KB_INCLUDE_UNRELEASED=1  nyalakan setelah fitur 2026 benar-benar tayang
    env_file:
      - ./wefluence-ai-support/.env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - wefluence
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: wefluence-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      caption-scraper:
        condition: service_started
      matrix-scrapper:
        condition: service_started
      ai-support:
        condition: service_started
    networks:
      - wefluence
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  wefluence:
    driver: bridge
